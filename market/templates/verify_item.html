<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Items</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Unverified Items</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Item ID</th>
                    <th>Name</th>
                    <th>Seller</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for item in unverified_items %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.seller.username }}</td>
                    <td>KES {{ item.price }}</td>
                    <td>
                        {% if not item.verified %}
                        <form action="{{ url_for('verify_item', item_id=item.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-success btn-sm">Verify</button>
                        </form>
                        {% endif %}
    
                        <form action="{{ url_for('admin_delete_item', item_id=item.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this item?');" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">No unverified items available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function confirmVerify() {
            return confirm("Are you sure you want to verify this item?");
        }
    </script>
</body>
</html>
